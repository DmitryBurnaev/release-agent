name: Scan

on:
  pull_request:
    branches:
      - "main"
  push:
    branches:
      - "main"
      - "feature/33-trivy-security-scans" # Temporary: verify Trivy on this branch; remove before merge.
  schedule:
    - cron: "0 0 * * 1" # Every Monday at 00:00

env:
  DOCKER_IMAGE: release-agent:scan-${{ github.sha }}
  TRIVY_VERSION: "0.76.2"
  TRIVY_SEVERITY: "CRITICAL,HIGH,MEDIUM,LOW"
  OPENGREP_VERSION: "v1.11.2"
  # SQLAlchemy/SQLAdmin mapped attributes are descriptors, not missed function calls.
  OPENGREP_SQLALCHEMY_FALSE_POSITIVE_RULE: "opengrep-rules.python.lang.maintainability.is-function-without-parentheses"
  TRUFFLEHOG_VERSION: "v3.90.12"
  GITLEAKS_VERSION: "v8.28.0"

jobs:
  trivy:
    name: trivy-${{ matrix.target }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target: [image, fs]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Trivy
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            --output "${RUNNER_TEMP}/trivy.tar.gz"
          echo "bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf  ${RUNNER_TEMP}/trivy.tar.gz" | sha256sum --check
          tar -xzf "${RUNNER_TEMP}/trivy.tar.gz" -C "${RUNNER_TEMP}" trivy

      - name: Build service image
        if: matrix.target == 'image'
        run: |
          docker build --target service --tag "${DOCKER_IMAGE}" .
          docker image inspect "${DOCKER_IMAGE}" --format '{{.Id}} {{.Architecture}}'

      - name: Scan image
        if: matrix.target == 'image'
        run: |
          "${RUNNER_TEMP}/trivy" image --config "" --ignorefile "" --image-src docker --scanners vuln \
            --severity "${TRIVY_SEVERITY}" --ignore-unfixed=false --format json \
            --output "${RUNNER_TEMP}/trivy-image-raw.json" "${DOCKER_IMAGE}"
          "${RUNNER_TEMP}/trivy" convert --config "" --ignorefile "" \
            --ignore-policy .github/scan/trivy-image-ignore.rego --format json \
            --output "${RUNNER_TEMP}/trivy-image.json" "${RUNNER_TEMP}/trivy-image-raw.json"

      - name: Scan filesystem
        if: matrix.target == 'fs'
        run: |
          "${RUNNER_TEMP}/trivy" fs --config "" --ignorefile "" --scanners vuln,misconfig --include-dev-deps \
            --severity "${TRIVY_SEVERITY}" --ignore-unfixed=false --format json \
            --output "${RUNNER_TEMP}/trivy-fs.json" .

      - name: Validate report
        run: |
          jq -e 'type == "object" and .SchemaVersion == 2 and (.Results == null or (.Results | type == "array"))' \
            "${RUNNER_TEMP}/trivy-${{ matrix.target }}.json" > /dev/null

      - name: Upload report
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: trivy-${{ matrix.target }}
          path: ${{ runner.temp }}/trivy-${{ matrix.target }}.json
          retention-days: 60
          if-no-files-found: error

      - name: Enforce findings
        run: |
          "${RUNNER_TEMP}/trivy" convert --config "" --ignorefile "" --format table --exit-code 1 \
            --severity "${TRIVY_SEVERITY}" "${RUNNER_TEMP}/trivy-${{ matrix.target }}.json"

  trufflehog:
    name: trufflehog
    if: github.event_name != 'pull_request' && (github.event_name != 'push' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    steps:
      - name: Install Trufflehog
        run: |
          curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh | sh -s -- -b /usr/local/bin ${{ env.TRUFFLEHOG_VERSION }}

      - uses: actions/checkout@v5

      - name: Run Trufflehog FS (report)
        run: |
          ls -lah ${{ runner.workspace }}
          trufflehog filesystem ${{ runner.workspace }} --results=verified,unknown --json > "${{ runner.workspace }}/trufflehog-results.json"

      - name: Upload scan results
        uses: actions/upload-artifact@v6
        with:
          name: trufflehog-results
          path: "${{ runner.workspace }}/trufflehog-results.json"
          retention-days: 60

      - name: Run Trufflehog FS (alert)
        run: |
          trufflehog filesystem ${{ runner.workspace }} --results=verified,unknown --fail --github-actions

  gitleaks:
    name: gitleaks
    if: github.event_name != 'pull_request' && (github.event_name != 'push' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    steps:
      - name: Install GitLeaks
        run: |
          git clone --branch ${{ env.GITLEAKS_VERSION }} https://github.com/gitleaks/gitleaks.git /home/runner/.gitleaks
          cd /home/runner/.gitleaks
          make build
          pwd
          ls -lah

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # Fetch all history for better secret detection

      - name: Run Gitleaks (report)
        run: |
          export PATH='/home/runner/.gitleaks':$PATH
          gitleaks git . --exit-code 0 --report-format json --report-path "${{ runner.workspace }}/gitleaks-results.json"

      - name: Upload scan results
        uses: actions/upload-artifact@v6
        with:
          name: gitleaks-results
          path: "${{ runner.workspace }}/gitleaks-results.json"
          retention-days: 60

      - name: Run Gitleaks (alert)
        run: |
          export PATH='/home/runner/.gitleaks':$PATH
          gitleaks git . --verbose

  opengrep:
    name: opengrep
    if: github.event_name != 'pull_request' && (github.event_name != 'push' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install Opengrep
        run: |
          curl -fsSL https://raw.githubusercontent.com/opengrep/opengrep/main/install.sh  | bash -s -- -v ${{ env.OPENGREP_VERSION }}

      - name: Clone Opengrep Rules
        run: |
          git clone https://github.com/opengrep/opengrep-rules.git

      - name: Run Opengrep Scan (report)
        run: |
          export PATH='/home/runner/.opengrep/cli/latest':$PATH
          opengrep scan \
            --config opengrep-rules/python \
            --exclude-rule "${OPENGREP_SQLALCHEMY_FALSE_POSITIVE_RULE}" \
            --json \
            -o "${{ runner.workspace }}/opengrep-results.json" \
            .

      - name: Upload scan results
        uses: actions/upload-artifact@v6
        with:
          name: opengrep-results
          path: "${{ runner.workspace }}/opengrep-results.json"
          retention-days: 60

      - name: Run Opengrep Scan (alert)
        run: |
          export PATH='/home/runner/.opengrep/cli/latest':$PATH
          opengrep scan \
            --config opengrep-rules/python \
            --exclude-rule "${OPENGREP_SQLALCHEMY_FALSE_POSITIVE_RULE}" \
            --error \
            .
