[project]
name = "release-agent"
version = "0.1.0"
description = "Release Agent (some helper system to manage releases)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi==0.142.2",
    "itsdangerous==2.2.0",         # required by session engine
    "uvicorn==0.54.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "httpx2[socks]==2.13.1",
    "sqlalchemy[asyncio]==2.1.3",
    "sqladmin==0.32.0",
    "alembic==1.20.0",
    "asyncpg==0.31.0",
    "pyjwt==2.15.1",
    "pycryptodomex==3.24.0",       # for API key encryptions
    "uvloop==0.23.0",
    "redis==8.1.0",                # for Redis cache backend
    "clickhouse-connect[async]==1.9.0",  # for ClickHouse analytics
]

[dependency-groups]
dev = [
    "types-wtforms==3.2.1.20260518",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "coverage==7.16.2",
    "black==26.10.0",
    "ruff==0.16.10",
    "mypy==2.4.0",
    # pycharm requires:
    "setuptools==84.0.0",
    "pip==26.2.1",
]

# === Ruff settings ===
[tool.ruff]
exclude = [
    ".git",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    ".vscode",
    "__pypackages__",
    "venv",
    ".idea/",
]

# Same as Black.
line-length = 100
indent-width = 4
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = []
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = false
docstring-code-line-length = "dynamic"

# === Other tools settings settings ===

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.mypy]
strict = true
exclude = ["src/tests", "src/migrations", ".local", "test_*"]

[[tool.mypy.overrides]]
module = ["clickhouse_connect", "clickhouse_connect.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["src/tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore:The 'u' type code is deprecated and will be removed in Python 3\\.16:DeprecationWarning",
]

[tool.coverage.report]
exclude_also = [
    # Regexes for lines to exclude from consideration
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
]

[tool.coverage.run]
source = ["src"]
omit = ["src/cli/*", "src/tests/*", "src/migrations/*"]
